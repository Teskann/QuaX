name: Generate icons
description: >
  Generates the PNG icons drawn from the logo of android/app/src/main/res/drawable/ic_logo.xml.
  Git does not track the monochrome one, which the app shows. The repository must be checked out
  first.

runs:
  using: composite
  steps:
    - name: Generate icons
      shell: bash
      run: |
        python -mvenv .venv
        source ./.venv/bin/activate
        pip install -r requirements.txt
        python generate_icons.py
        deactivate
