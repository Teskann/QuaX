name: release

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  test:
    uses: ./.github/workflows/test.yml

  create_release:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Clone the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Install and set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'zulu'
          java-version: '25.x'
      
      - name:
        run: echo $SIGNING_KEY | base64 -d > android/app/key.jks
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Install and set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc

      - name: Generate icons
        run: |
          python -mvenv .venv
          source ./.venv/bin/activate
          pip install -r requirements.txt
          python generate_icons.py
          deactivate

      - name: Build APKs
        run: |
          flutter config --no-analytics
          flutter pub get
          dart run flutter_launcher_icons
          dart run dart_pubspec_licenses:generate
          dart run intl_utils:generate
          dart run flutter_iconpicker:generate_packs --packs material

          # Create a directory for our release APKs	
          mkdir -pv build/app/outputs/release

          # Build our big boy APK, and move it into the release APKs folder
          flutter build apk --release --no-tree-shake-icons
          
          mv build/app/outputs/apk/release/*.apk build/app/outputs/release

          # Build our ABI-specific APKs and move them into the release APKs folder
          flutter build apk --release --no-tree-shake-icons --split-per-abi --target-platform=android-x64,android-arm,android-arm64
          
          mv build/app/outputs/apk/release/*.apk build/app/outputs/release
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PATH: key.jks

      - name: Create release
        id: upload-release-assets
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          prerelease: false
          body_path: release-notes.md
          files: |
            build/app/outputs/release/*.apk

      - name: Publish the release
        uses: eregon/publish-release@01df127f5e9a3c26935118e22e738d95b59d10ce # v1.0.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release_id: ${{ steps.upload-release-assets.outputs.id }}
