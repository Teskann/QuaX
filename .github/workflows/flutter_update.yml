name: Flutter update

on:
  schedule:
    - cron: "0 6 * * *"

permissions: {}

concurrency:
  group: flutter-update
  cancel-in-progress: false

jobs:
  check:
    name: Check for a new Flutter release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      needed: ${{ steps.check.outputs.needed }}
      version: ${{ steps.check.outputs.version }}
      branch: ${{ steps.check.outputs.branch }}

    steps:
      - name: Clone the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Compare .fvmrc with the latest stable release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          releases=$(curl -fsSL https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json)

          hash=$(echo "$releases" | jq -r '.current_release.stable')
          version=$(echo "$releases" | jq -r --arg hash "$hash" \
            'first(.releases[] | select(.hash == $hash and .channel == "stable")).version')

          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "Could not determine the latest stable Flutter version."
            exit 1
          fi

          current_version=$(jq -r '.flutter' .fvmrc)
          branch="flutter-update/$version"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          if [ "$version" = "$current_version" ]; then
            echo "Already pinned to Flutter $current_version."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$(printf '%s\n%s\n' "$current_version" "$version" | sort -V | tail -1)" != "$version" ]; then
            echo "Pinned Flutter $current_version is newer than the latest stable $version."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "A pull request for $branch is already open."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Flutter $current_version -> $version."
          echo "needed=true" >> "$GITHUB_OUTPUT"

  update:
    name: Update to Flutter ${{ needs.check.outputs.version }}
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Clone the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install and set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'zulu'
          java-version: '25.x'

      - name: Install and set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ needs.check.outputs.version }}
          channel: stable
          cache: true

      - name: Generate icons
        run: |
          python -mvenv .venv
          source ./.venv/bin/activate
          pip install -r requirements.txt
          python generate_icons.py
          deactivate

      - name: Update the SDK and the dependencies
        uses: anthropics/claude-code-action@7b0b255830a1fab6e602658672acad11c12d841d # v1.0.226
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"
            --max-turns 120
          prompt: "/flutter-update ${{ needs.check.outputs.version }}"

      - name: Verify the build
        run: |
          set -euo pipefail
          flutter pub get
          dart run flutter_launcher_icons
          dart run dart_pubspec_licenses:generate
          dart run intl_utils:generate
          dart run flutter_iconpicker:generate_packs --packs material
          flutter analyze
          flutter build apk --debug

      - name: Archive the debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quax-flutter-${{ needs.check.outputs.version }}-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Write the pull request text
        env:
          SUMMARY: /tmp/flutter-update-pr.md
          PR_TEXT: ${{ runner.temp }}/pr
        run: |
          set -euo pipefail

          if [ ! -s "$SUMMARY" ]; then
            echo "$SUMMARY is missing or empty: the update did not complete."
            exit 1
          fi

          mkdir -p "$PR_TEXT"
          head -1 "$SUMMARY" > "$PR_TEXT/title"
          {
            tail -n +2 "$SUMMARY"
            echo
            echo "<details><summary>flutter pub outdated</summary>"
            echo
            echo '```'
            flutter pub outdated || true
            echo '```'
            echo
            echo "</details>"
          } > "$PR_TEXT/body.md"

      # Everything the build produces is gitignored, so only the update ends up in the patch.
      - name: Hand the changes over
        uses: ./.github/actions/changes-to-artifact
        with:
          name: flutter-update-${{ needs.check.outputs.version }}
          files: |
            ${{ runner.temp }}/pr/title
            ${{ runner.temp }}/pr/body.md

  publish:
    name: Commit, push and open the pull request
    needs: [check, update]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      # The same commit as the update job: both check out github.sha.
      - name: Clone the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Take the changes over
        id: changes
        uses: ./.github/actions/changes-from-artifact
        with:
          name: flutter-update-${{ needs.check.outputs.version }}

      - name: Commit, push and open the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ needs.check.outputs.branch }}
          CHANGED: ${{ steps.changes.outputs.changed }}
          PR_TEXT: ${{ steps.changes.outputs.dir }}/pr
        run: |
          set -euo pipefail

          if [ "$CHANGED" != "true" ]; then
            echo "The upgrade changed nothing."
            exit 1
          fi

          git commit -F "$PR_TEXT/title"
          git push --force origin "HEAD:refs/heads/$BRANCH"

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "A pull request is already open for $BRANCH; the push updated it."
            exit 0
          fi

          gh pr create --base master --head "$BRANCH" \
            --title "$(cat "$PR_TEXT/title")" --body-file "$PR_TEXT/body.md"
