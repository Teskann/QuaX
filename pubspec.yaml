name: quax
description: A private and clean way to browse Twitter/X

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html

version: 4.13.4+400001046

environment:
  sdk: "3.13.3"
  flutter: 3.47.4

dependency_overrides:
  # auto_direction pins an old intl (^0.17/^0.18) that conflicts with
  # dart_twitter_api's intl ^0.20.0. auto_direction only uses the stable
  # Bidi.detectRtlDirectionality API, so forcing the modern intl is safe.
  intl: ^0.20.2
  # flutter_iconpicker (dev-only codegen) pins dcli <8.0.0, which conflicts
  # with file_picker's win32 ^6.3.0 requirement (dcli <9.0.0 pulls win32
  # ^5.0.0). Forcing a modern dcli resolves that; win32/dart_console no
  # longer need overriding themselves since dcli now pulls compatible
  # versions of both on its own.
  dcli: ^10.0.0

dependencies:
  flutter:
    sdk: flutter

  # Core Flutter dependencies
  material_ui: ^1.1.1
  flutter_localizations:
    sdk: flutter

  # API & Networking
  http: ^1.2.1
  dart_twitter_api: 0.6.0
  html: ^0.15.4

  # UI & Media
  # Stuck on 0.0.6: it predates Dart 3.0 and only declares the default
  # "sdk: <3.0.0" upper bound, which pub treats as auto-widened to any 3.x
  # SDK for packages published before Dart 3 shipped. 0.0.7 was published
  # after Dart 3 shipped, so its explicit "sdk: <3.13.0" bound is enforced
  # literally and excludes our pinned 3.13.3 SDK.
  auto_direction: ^0.0.6
  extended_image: ^10.0.0
  extended_nested_scroll_view: ^6.0.0
  flutter_staggered_grid_view: ^0.7.0
  infinite_scroll_pagination: ^5.1.1
  flutter_cache: ^0.1.0
  flutter_material_color_picker: ^1.2.0
  file_picker: ^13.1.0
  flutter_file_dialog: ^3.0.1
  flutter_iconpicker: ^4.0.1
  flutter_portal: ^1.1.4
  webview_flutter: 4.14.1
  webview_cookie_manager_plus: ^2.0.16

  # Localization & Styling
  intl: any
  flutter_localized_locales: ^2.0.3
  dynamic_color: ^2.1.0

  # State Management & Data
  pref: ^3.0.0
  provider: ^6.0.4
  flutter_triple: ^3.0.0
  multi_select_flutter: ^4.1.3

  # Utilities & Helpers
  crypto: ^3.0.3
  html_unescape: ^2.0.0
  logging: ^1.1.0
  measure_size: ^5.0.2
  package_info_plus: ^10.1.0
  path: ^1.8.2
  path_provider: ^2.0.11
  permission_handler: ^13.0.1
  quiver: ^3.1.0
  scroll_to_index: ^3.0.1
  secure_content: ^2.0.0
  share_plus: ^13.1.0
  sqflite: ^2.2.2
  sqflite_common: ^2.4.0+2
  sqflite_common_ffi: ^2.2.0+1
  sqflite_migration_plan: ^1.0.0
  timeago: ^3.3.0
  app_links: ^7.0.0
  url_launcher: ^6.3.2
  android_intent_plus: ^6.0.0
  uuid: ^4.3.3
  visibility_detector: ^0.4.0+2
  wakelock_plus: ^1.6.1

  # Miscellaneous
  async_button_builder: ^3.0.0+1
  better_player_plus: ^1.3.4
  ffcache: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  flutter_lints:
  dart_pubspec_licenses: ^3.2.0
  intl_utils: ^2.8.1
  arb_utils: ^0.11.1
  collection: ^1.19.1
  puppeteer: ^3.26.0
  wakelock_plus_platform_interface: ^1.7.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material icons font is
  # included with your application, so that you can use the icons in
  # the material icons class.
  uses-material-design: true

  assets:
    - assets/icon.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.
  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
  generate: true

flutter_intl:
  enabled: true
  class_name: L10n

flutter_launcher_icons:
  image_path: "assets/icon.png"
  android: true
  adaptive_icon_background: "assets/icon-background.png"
  adaptive_icon_foreground: "assets/icon-foreground-432x432.png"
  adaptive_icon_foreground_inset: 16
  adaptive_icon_monochrome: "assets/icon-monochrome-432x432.png"